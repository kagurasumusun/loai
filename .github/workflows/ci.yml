name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Smoke test (help)
        run: cargo run --release -- --help
      - name: Smoke test (models list)
        run: cargo run --release -- models list
      - name: Smoke test (doctor)
        run: cargo run --release -- doctor
